[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calc-units"
version = "0.1.0"
description = "A terminal calculator that understands units"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kevin Liu"}]

[project.scripts]
calc = "calc.cli:main"

[tool.setuptools.packages.find]
include = ["calc*"]
